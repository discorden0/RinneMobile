name: Build English APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the English build
        required: true
        default: rinnemobile-en-2026-11-01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" out/RinneMobile-English-debug.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rinnemobile-english-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$TAG" out/RinneMobile-English-debug.apk \
            -R "${{ github.repository }}" \
            --title "RinneMobile English build $TAG" \
            --notes "English-translated build of RinneMobile, built from source by GitHub Actions.

          Debug-signed APK, installable directly (allow installation from unknown sources).

          Based on https://github.com/Weiss-UltimateSavior/RinneMobile (GPL-3.0)."
